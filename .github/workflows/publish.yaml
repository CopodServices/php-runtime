name: Publish

on:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v6

      - name: Build information
        id: build_info
        run: |
          # Immutable tag per build; moving version tag on main; latest on release.
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.php }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: |
            ghcr.io/copodservices/php-runtime:${{ matrix.php }}-${{ steps.build_info.outputs.tag }}
            ghcr.io/copodservices/php-runtime:${{ matrix.php }}

      - name: Assert the package is publicly pullable
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/copodservices/php-runtime:${{ matrix.php }}-${{ steps.build_info.outputs.tag }}
