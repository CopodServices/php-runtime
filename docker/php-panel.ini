; Defaults for every hosted site. The entrypoint appends environment-driven
; overrides under /mnt/server/.runtime/php/conf.d, which PHP_INI_SCAN_DIR adds.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = UTC
session.save_path = /mnt/server/.runtime/php/sessions
upload_tmp_dir = /mnt/server/.runtime/php/uploads
sys_temp_dir = /mnt/server/.runtime/tmp
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
